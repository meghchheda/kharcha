<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kharcha — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE9DC;
    --paper-line: #D8D2C0;
    --ink: #21261F;
    --ink-soft: #565C4E;
    --ledger-green: #3B6B4A;
    --ledger-green-dark: #2A4E36;
    --rust: #7A4B32;
    --mustard: #C9A227;
    --card: #F6F4EA;
    --danger: #9A3324;
    font-size: 16px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 34px, rgba(33,38,31,0.035) 35px);
    min-height: 100vh;
  }

  .wrap{
    max-width: 920px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ---------- Header / cover stamp ---------- */
  header{
    padding: 48px 0 28px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom: 3px double var(--ink);
    gap: 20px;
  }

  header h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight: 600;
    font-size: 2.6rem;
    margin:0;
    letter-spacing: -0.01em;
  }
  header h1 span{ color: var(--ledger-green); font-style: italic; font-weight: 500; }

  header p{ margin:6px 0 0; color:var(--ink-soft); font-size:0.92rem; }

  .stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1.5px solid var(--rust);
    color: var(--rust);
    padding: 8px 14px;
    border-radius: 3px;
    transform: rotate(-3deg);
    white-space:nowrap;
  }

  /* ---------- Totals tape ---------- */
  .tape{
    margin-top: 24px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:1px;
    background: var(--ink);
    border: 1px solid var(--ink);
  }
  .tape .cell{
    background: var(--card);
    padding: 16px 20px;
  }
  .tape .cell .label{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color: var(--ink-soft);
  }
  .tape .cell .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:1.5rem;
    font-weight:600;
    margin-top: 4px;
  }
  .tape .cell.total .value{ color: var(--ledger-green-dark); }

  /* ---------- Entry slip (form) ---------- */
  .slip{
    margin-top: 34px;
    background: var(--card);
    border: 1px solid var(--paper-line);
    box-shadow: 0 1px 0 var(--paper-line), 0 2px 10px rgba(33,38,31,0.06);
    padding: 22px 24px 20px;
    position:relative;
  }
  .slip::before{
    content:"New entry";
    position:absolute;
    top:-11px; left:20px;
    background: var(--paper);
    padding: 0 8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color: var(--ink-soft);
  }

  form{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr 1.6fr auto;
    gap: 12px;
    align-items:end;
  }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-size: 0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--ink-soft);
  }
  .field input, .field select{
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    padding: 9px 10px;
    border:1px solid var(--paper-line);
    border-radius: 4px;
    background:#fff;
    color: var(--ink);
  }
  .field input:focus, .field select:focus{
    outline: 2px solid var(--ledger-green);
    outline-offset: 1px;
  }
  .field.amount input{ font-family:'IBM Plex Mono', monospace; }

  button.add-btn{
    background: var(--ledger-green);
    color: #fff;
    border:none;
    padding: 10px 18px;
    border-radius:4px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
    height: 40px;
    transition: background 0.15s ease;
  }
  button.add-btn:hover{ background: var(--ledger-green-dark); }
  button.add-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset:2px; }

  .form-error{
    grid-column: 1 / -1;
    color: var(--danger);
    font-size:0.82rem;
    display:none;
  }

  /* ---------- Body: tab rail + ledger table ---------- */
  .ledger-area{
    display:grid;
    grid-template-columns: 150px 1fr;
    gap: 0;
    margin-top: 36px;
  }

  .tabs{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-top: 6px;
  }
  .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.76rem;
    text-align:left;
    background: var(--card);
    border:1px solid var(--paper-line);
    border-right: none;
    padding: 9px 12px;
    cursor:pointer;
    color: var(--ink-soft);
    border-radius: 4px 0 0 4px;
    position:relative;
  }
  .tab .dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    margin-right:7px;
  }
  .tab.active{
    background: var(--paper);
    color: var(--ink);
    font-weight:600;
    box-shadow: inset 3px 0 0 var(--ledger-green);
  }

  .ledger-table{
    background: var(--card);
    border:1px solid var(--paper-line);
    min-height: 240px;
  }

  .row{
    display:grid;
    grid-template-columns: 96px 130px 1fr 110px 40px;
    gap: 10px;
    align-items:center;
    padding: 11px 16px;
    border-bottom: 1px solid var(--paper-line);
    font-size:0.9rem;
    animation: settle 0.25s ease;
  }
  .row.head{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--ink-soft);
    background: rgba(33,38,31,0.03);
  }
  .row:last-child{ border-bottom:none; }
  .row .date{ color: var(--ink-soft); font-family:'IBM Plex Mono', monospace; font-size:0.82rem; }
  .row .cat{
    font-size:0.74rem;
    padding: 3px 9px;
    border-radius: 20px;
    width: fit-content;
    font-weight:600;
  }
  .row .desc{ color: var(--ink); }
  .row .amt{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    text-align:right;
    color: var(--rust);
  }
  .row .del{
    background:none;
    border:none;
    color: var(--ink-soft);
    cursor:pointer;
    font-size:1rem;
    justify-self:end;
    padding: 4px 6px;
    border-radius:4px;
  }
  .row .del:hover{ color: var(--danger); background: rgba(154,51,36,0.08); }

  @keyframes settle{
    from{ opacity:0; transform: translateY(-4px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .empty{
    padding: 48px 24px;
    text-align:center;
    color: var(--ink-soft);
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size:1.05rem;
  }

  footer{
    text-align:center;
    margin-top: 40px;
    color: var(--ink-soft);
    font-size: 0.78rem;
    font-family:'IBM Plex Mono', monospace;
  }

  @media (max-width: 720px){
    form{ grid-template-columns: 1fr 1fr; }
    button.add-btn{ grid-column: 1 / -1; }
    .ledger-area{ grid-template-columns: 1fr; }
    .tabs{ flex-direction:row; flex-wrap:wrap; padding-top:0; margin-bottom:10px; }
    .tab{ border-radius:4px; border-right:1px solid var(--paper-line); }
    .row{ grid-template-columns: 70px 90px 1fr 80px 30px; font-size:0.82rem; }
    header{ flex-direction:column; align-items:flex-start; }
  }

  @media (prefers-reduced-motion: reduce){
    .row{ animation:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>The <span>Kharcha</span></h1>
      <p>A running record of where the money goes.</p>
    </div>
    <div class="stamp" id="todayStamp">— · —</div>
  </header>

  <div class="tape">
    <div class="cell">
      <div class="label">Entries</div>
      <div class="value" id="statCount">0</div>
    </div>
    <div class="cell">
      <div class="label">Top category</div>
      <div class="value" id="statTop" style="font-size:1.1rem;">—</div>
    </div>
    <div class="cell total">
      <div class="label">Total spent</div>
      <div class="value" id="statTotal">₹0.00</div>
    </div>
  </div>

  <div class="slip">
    <form id="expenseForm">
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" name="date">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <input list="categoryList" id="category" name="category" placeholder="Food" autocomplete="off">
        <datalist id="categoryList"></datalist>
      </div>
      <div class="field amount">
        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00" required>
      </div>
      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" name="description" placeholder="What was it for?">
      </div>
      <button type="submit" class="add-btn">Add entry</button>
      <div class="form-error" id="formError"></div>
    </form>
  </div>

  <div class="ledger-area">
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="__all__"><span class="dot" style="background:var(--ink-soft)"></span>All</button>
    </div>
    <div class="ledger-table">
      <div class="row head">
        <div>Date</div>
        <div>Category</div>
        <div>Description</div>
        <div style="text-align:right;">Amount</div>
        <div></div>
      </div>
      <div id="rows"></div>
    </div>
  </div>

  <footer>recorded locally · stored in expenses.db</footer>
</div>

<script>
const CAT_COLORS = ['#3B6B4A','#7A4B32','#C9A227','#4A6D8C','#8A4A6B','#5A7A3E','#9A5B24'];
function catColor(name){
  let h = 0;
  for(const c of name) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return CAT_COLORS[h % CAT_COLORS.length];
}
function hexToRgba(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

let expenses = [];
let activeCat = '__all__';

const fmt = (n) => '₹' + Number(n).toFixed(2);

document.getElementById('todayStamp').textContent = new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
document.getElementById('date').valueAsDate = new Date();

async function loadExpenses(){
  const res = await fetch('/api/expenses');
  expenses = await res.json();
  renderTabs();
  renderRows();
  renderStats();
}

function renderTabs(){
  const cats = [...new Set(expenses.map(e => e.category))].sort();
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'tab' + (activeCat === '__all__' ? ' active' : '');
  allBtn.dataset.cat = '__all__';
  allBtn.innerHTML = `<span class="dot" style="background:var(--ink-soft)"></span>All`;
  allBtn.onclick = () => { activeCat = '__all__'; renderTabs(); renderRows(); };
  tabs.appendChild(allBtn);

  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeCat === cat ? ' active' : '');
    btn.dataset.cat = cat;
    btn.innerHTML = `<span class="dot" style="background:${catColor(cat)}"></span>${cat}`;
    btn.onclick = () => { activeCat = cat; renderTabs(); renderRows(); };
    tabs.appendChild(btn);
  });

  const datalist = document.getElementById('categoryList');
  datalist.innerHTML = cats.map(c => `<option value="${c}">`).join('');
}

function renderRows(){
  const container = document.getElementById('rows');
  const list = activeCat === '__all__' ? expenses : expenses.filter(e => e.category === activeCat);

  if(list.length === 0){
    container.innerHTML = `<div class="empty">No entries yet — the first line is always the hardest to write.</div>`;
    return;
  }

  container.innerHTML = list.map(e => {
    const color = catColor(e.category);
    return `
      <div class="row" data-id="${e.id}">
        <div class="date">${e.date || '—'}</div>
        <div><span class="cat" style="background:${hexToRgba(color,0.15)};color:${color}">${escapeHtml(e.category)}</span></div>
        <div class="desc">${escapeHtml(e.description) || '<span style=\"color:var(--ink-soft)\">—</span>'}</div>
        <div class="amt">${fmt(e.amount)}</div>
        <button class="del" title="Delete entry" data-id="${e.id}">✕</button>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => deleteExpense(btn.dataset.id));
  });
}

function renderStats(){
  document.getElementById('statCount').textContent = expenses.length;
  const total = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
  document.getElementById('statTotal').textContent = fmt(total);

  const byCat = {};
  expenses.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + Number(e.amount); });
  const top = Object.entries(byCat).sort((a,b) => b[1]-a[1])[0];
  document.getElementById('statTop').textContent = top ? top[0] : '—';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function deleteExpense(id){
  const row = document.querySelector(`.row[data-id="${id}"]`);
  if(row) row.style.opacity = '0.4';
  const res = await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
  if(res.ok){
    expenses = expenses.filter(e => String(e.id) !== String(id));
    renderTabs();
    renderRows();
    renderStats();
  } else if(row){
    row.style.opacity = '1';
  }
}

document.getElementById('expenseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('formError');
  errorEl.style.display = 'none';

  const payload = {
    date: document.getElementById('date').value,
    category: document.getElementById('category').value,
    amount: document.getElementById('amount').value,
    description: document.getElementById('description').value,
  };

  const res = await fetch('/api/expenses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if(!res.ok){
    const err = await res.json().catch(() => ({}));
    errorEl.textContent = err.error || 'Something went wrong — check the amount and try again.';
    errorEl.style.display = 'block';
    return;
  }

  document.getElementById('amount').value = '';
  document.getElementById('description').value = '';
  document.getElementById('category').value = '';
  document.getElementById('date').valueAsDate = new Date();

  await loadExpenses();
});

loadExpenses();
</script>
</body>
</html>
